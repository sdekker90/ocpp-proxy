name: OCPP Proxy
version: '0.2.0'
slug: ocpp-proxy
description: 'OCPP proxy that relays one EV charger to multiple OCPP services'
homeassistant_api: true
init: false
arch:
  - amd64
  - armv7
  - aarch64
  - armhf
startup: services
boot: auto
ports:
  9000/tcp: 9000
ports_description:
  9000/tcp: OCPP proxy (charger connection)
options:
  allow_shared_charging: true
  preferred_provider: ''
  blocked_providers: []
  allowed_providers: []
  presence_sensor: ''
  override_input_boolean: ''
  rate_limit_seconds: 10
  ocpp_services: []
schema:
  allow_shared_charging: bool
  preferred_provider: str?
  blocked_providers:
    - str
  allowed_providers:
    - str
  presence_sensor: str?
  override_input_boolean: str?
  rate_limit_seconds: int(1,300)
  ocpp_services:
    - id: str
      url: str
      primary: bool?
      read_only: bool?
      auth_type: list(none|basic|token)?
      username: str?
      password: str?
      token: str?
      enabled: bool?
